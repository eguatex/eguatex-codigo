<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1" />
    <title>ÉguaTex</title>
    %sveltekit.head%
    <script>
      try {
        if (sessionStorage.getItem("eguatex-abertura-vista") !== "1") document.documentElement.style.background = "#1c0a2b";
      } catch (e) {
        document.documentElement.style.background = "#1c0a2b";
      }
    </script>
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
