<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1B5E20"/>
      <stop offset="100%" stop-color="#4A148C"/>
    </linearGradient>
    <linearGradient id="cabelo" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#FFD600"/>
      <stop offset="30%" stop-color="#FF6D00"/>
      <stop offset="70%" stop-color="#E53935"/>
      <stop offset="100%" stop-color="#B71C1C"/>
    </linearGradient>
    <linearGradient id="folhaEsq" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2E7D32"/>
      <stop offset="100%" stop-color="#1B5E20"/>
    </linearGradient>
    <linearGradient id="folhaDir" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#388E3C"/>
      <stop offset="100%" stop-color="#1B5E20"/>
    </linearGradient>
    <linearGradient id="florAmarela" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#FFD600"/>
      <stop offset="100%" stop-color="#F9A825"/>
    </linearGradient>
    <linearGradient id="florRosa" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#F06292"/>
      <stop offset="100%" stop-color="#C2185B"/>
    </linearGradient>
    <linearGradient id="florVermelha" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#EF5350"/>
      <stop offset="100%" stop-color="#C62828"/>
    </linearGradient>
  </defs>

  <!-- Fundo arredondado -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Folhas grandes no fundo (estilo tropical) -->
  <!-- Folha superior esquerda -->
  <path d="M30 0 Q60 80 40 180 Q30 140 15 120 Q5 80 30 0Z" fill="#2E7D32" opacity="0.7" transform="translate(20,10)"/>
  <path d="M60 0 Q90 60 80 150 Q70 100 50 80 Q35 50 60 0Z" fill="#388E3C" opacity="0.6" transform="translate(60,0) rotate(10,60,0)"/>
  <path d="M0 50 Q40 30 100 60 Q60 55 40 70 Q15 75 0 50Z" fill="#43A047" opacity="0.5" transform="translate(0,50)"/>

  <!-- Folha superior direita -->
  <path d="M0 0 Q-30 80 -10 170 Q0 130 15 110 Q25 70 0 0Z" fill="#2E7D32" opacity="0.7" transform="translate(490,15) scale(-1,1)"/>
  <path d="M0 20 Q50 10 110 50 Q70 40 45 55 Q15 65 0 20Z" fill="#388E3C" opacity="0.5" transform="translate(380,30)"/>

  <!-- Folha inferior esquerda -->
  <path d="M40 512 Q20 440 50 370 Q45 410 60 430 Q70 460 40 512Z" fill="#1B5E20" opacity="0.6" transform="translate(10,0)"/>

  <!-- Folha inferior direita -->
  <path d="M472 512 Q492 440 462 380 Q467 420 452 440 Q442 470 472 512Z" fill="#1B5E20" opacity="0.6"/>

  <!-- Flor amarela grande (direita) -->
  <g transform="translate(380, 120) rotate(-15)">
    <ellipse cx="0" cy="-22" rx="14" ry="22" fill="url(#florAmarela)" opacity="0.85"/>
    <ellipse cx="0" cy="-22" rx="14" ry="22" fill="url(#florAmarela)" opacity="0.85" transform="rotate(72)"/>
    <ellipse cx="0" cy="-22" rx="14" ry="22" fill="url(#florAmarela)" opacity="0.85" transform="rotate(144)"/>
    <ellipse cx="0" cy="-22" rx="14" ry="22" fill="url(#florAmarela)" opacity="0.85" transform="rotate(216)"/>
    <ellipse cx="0" cy="-22" rx="14" ry="22" fill="url(#florAmarela)" opacity="0.85" transform="rotate(288)"/>
    <circle cx="0" cy="0" r="8" fill="#F57F17"/>
  </g>

  <!-- Flor rosa (inferior esquerda) -->
  <g transform="translate(100, 430) rotate(10)">
    <ellipse cx="0" cy="-18" rx="12" ry="18" fill="url(#florRosa)" opacity="0.8"/>
    <ellipse cx="0" cy="-18" rx="12" ry="18" fill="url(#florRosa)" opacity="0.8" transform="rotate(72)"/>
    <ellipse cx="0" cy="-18" rx="12" ry="18" fill="url(#florRosa)" opacity="0.8" transform="rotate(144)"/>
    <ellipse cx="0" cy="-18" rx="12" ry="18" fill="url(#florRosa)" opacity="0.8" transform="rotate(216)"/>
    <ellipse cx="0" cy="-18" rx="12" ry="18" fill="url(#florRosa)" opacity="0.8" transform="rotate(288)"/>
    <circle cx="0" cy="0" r="6" fill="#AD1457"/>
  </g>

  <!-- Flores vermelhas pequenas (superior direita) -->
  <g transform="translate(420, 70)">
    <ellipse cx="0" cy="-10" rx="6" ry="10" fill="url(#florVermelha)" opacity="0.75"/>
    <ellipse cx="0" cy="-10" rx="6" ry="10" fill="url(#florVermelha)" opacity="0.75" transform="rotate(72)"/>
    <ellipse cx="0" cy="-10" rx="6" ry="10" fill="url(#florVermelha)" opacity="0.75" transform="rotate(144)"/>
    <ellipse cx="0" cy="-10" rx="6" ry="10" fill="url(#florVermelha)" opacity="0.75" transform="rotate(216)"/>
    <ellipse cx="0" cy="-10" rx="6" ry="10" fill="url(#florVermelha)" opacity="0.75" transform="rotate(288)"/>
    <circle cx="0" cy="0" r="4" fill="#B71C1C"/>
  </g>

  <!-- Flor amarela pequena -->
  <g transform="translate(440, 180) rotate(20)">
    <ellipse cx="0" cy="-10" rx="7" ry="11" fill="url(#florAmarela)" opacity="0.7"/>
    <ellipse cx="0" cy="-10" rx="7" ry="11" fill="url(#florAmarela)" opacity="0.7" transform="rotate(72)"/>
    <ellipse cx="0" cy="-10" rx="7" ry="11" fill="url(#florAmarela)" opacity="0.7" transform="rotate(144)"/>
    <ellipse cx="0" cy="-10" rx="7" ry="11" fill="url(#florAmarela)" opacity="0.7" transform="rotate(216)"/>
    <ellipse cx="0" cy="-10" rx="7" ry="11" fill="url(#florAmarela)" opacity="0.7" transform="rotate(288)"/>
    <circle cx="0" cy="0" r="5" fill="#F57F17"/>
  </g>

  <!-- === CURUPIRA === -->

  <!-- Corpo / pele -->
  <rect x="226" y="260" width="60" height="90" rx="10" fill="#D4915C"/>

  <!-- Roupa de folhas (saia) -->
  <path d="M215 310 Q225 295 240 310 Q248 295 256 310 Q264 295 272 310 Q280 295 297 310 L297 345 Q256 355 215 345Z" fill="#2E7D32"/>
  <path d="M218 315 Q228 302 243 315 Q251 302 259 315 Q267 302 275 315 Q283 302 294 315 L294 340 Q256 348 218 340Z" fill="#388E3C"/>

  <!-- Colar de folhas -->
  <path d="M225 258 Q235 250 245 258 Q250 250 256 258 Q262 250 267 258 Q277 250 287 258" stroke="#2E7D32" stroke-width="5" fill="none" stroke-linecap="round"/>
  <ellipse cx="235" cy="255" rx="6" ry="4" fill="#43A047"/>
  <ellipse cx="256" cy="253" rx="6" ry="4" fill="#388E3C"/>
  <ellipse cx="277" cy="255" rx="6" ry="4" fill="#43A047"/>

  <!-- Bracos -->
  <path d="M226 270 Q200 285 185 310" stroke="#D4915C" stroke-width="18" fill="none" stroke-linecap="round"/>
  <path d="M286 270 Q312 285 327 310" stroke="#D4915C" stroke-width="18" fill="none" stroke-linecap="round"/>

  <!-- Pulseiras de folha nos pulsos -->
  <circle cx="185" cy="310" r="8" fill="#2E7D32"/>
  <circle cx="327" cy="310" r="8" fill="#2E7D32"/>

  <!-- Mao esquerda segurando lanca -->
  <circle cx="180" cy="315" r="9" fill="#D4915C"/>

  <!-- Lanca -->
  <line x1="178" y1="120" x2="182" y2="400" stroke="#3E2723" stroke-width="5" stroke-linecap="round"/>
  <path d="M174 120 L180 85 L186 120Z" fill="#37474F"/>

  <!-- Mao direita segurando documento -->
  <circle cx="332" cy="315" r="9" fill="#D4915C"/>

  <!-- Documento LaTeX na mao -->
  <g transform="translate(320, 310) rotate(-8)">
    <rect x="0" y="0" width="52" height="68" rx="3" fill="white" opacity="0.95"/>
    <rect x="0" y="0" width="52" height="68" rx="3" stroke="#BDBDBD" stroke-width="1" fill="none"/>
    <line x1="8" y1="12" x2="44" y2="12" stroke="#BDBDBD" stroke-width="2"/>
    <line x1="8" y1="20" x2="40" y2="20" stroke="#BDBDBD" stroke-width="2"/>
    <line x1="8" y1="28" x2="36" y2="28" stroke="#BDBDBD" stroke-width="2"/>
    <line x1="8" y1="36" x2="42" y2="36" stroke="#BDBDBD" stroke-width="2"/>
    <line x1="8" y1="44" x2="32" y2="44" stroke="#BDBDBD" stroke-width="2"/>
    <text x="8" y="60" font-family="serif" font-size="12" fill="#7B1FA2" font-weight="bold">LaTeX</text>
  </g>

  <!-- Cabeca -->
  <ellipse cx="256" cy="220" rx="52" ry="55" fill="#D4915C"/>

  <!-- Cabelo flamejante (estilo da referencia) -->
  <path d="M204 220 Q200 170 215 130 Q220 150 225 125 Q230 155 240 110
           Q245 145 256 95 Q267 145 272 110 Q280 155 285 125
           Q290 150 295 130 Q310 170 308 220
           Q290 200 270 210 Q256 200 242 210 Q222 200 204 220Z"
        fill="url(#cabelo)"/>
  <!-- Mechas extras para volume -->
  <path d="M215 200 Q208 160 220 120 Q225 145 230 115 Q235 140 245 100
           Q243 145 256 105 Q260 130 268 100 Q272 140 278 115
           Q282 145 290 120 Q302 160 297 200
           Q280 185 260 195 Q240 185 215 200Z"
        fill="url(#cabelo)" opacity="0.6"/>

  <!-- Olhos -->
  <ellipse cx="238" cy="222" rx="12" ry="14" fill="white"/>
  <ellipse cx="274" cy="222" rx="12" ry="14" fill="white"/>
  <circle cx="240" cy="224" r="7" fill="#1B5E20"/>
  <circle cx="276" cy="224" r="7" fill="#1B5E20"/>
  <circle cx="242" cy="221" r="2.5" fill="white"/>
  <circle cx="278" cy="221" r="2.5" fill="white"/>

  <!-- Sobrancelhas -->
  <path d="M228 210 Q238 205 248 210" stroke="#8D6E63" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M264 210 Q274 205 284 210" stroke="#8D6E63" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Nariz -->
  <path d="M253 232 Q256 238 259 232" stroke="#B8845C" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Sorriso -->
  <path d="M240 244 Q256 260 272 244" stroke="#8D6E63" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Bochechas coradas -->
  <ellipse cx="228" cy="238" rx="8" ry="5" fill="#E57373" opacity="0.35"/>
  <ellipse cx="284" cy="238" rx="8" ry="5" fill="#E57373" opacity="0.35"/>

  <!-- Pernas -->
  <rect x="235" y="340" width="16" height="50" rx="6" fill="#D4915C"/>
  <rect x="261" y="340" width="16" height="50" rx="6" fill="#D4915C"/>

  <!-- Caneleiras de folha -->
  <ellipse cx="243" cy="365" rx="10" ry="5" fill="#2E7D32"/>
  <ellipse cx="269" cy="365" rx="10" ry="5" fill="#2E7D32"/>

  <!-- Pes virados para tras (a marca do Curupira!) -->
  <!-- Pe esquerdo: dedos apontam para tras -->
  <ellipse cx="243" cy="393" rx="18" ry="8" fill="#C68642"/>
  <ellipse cx="228" cy="390" rx="5" ry="4" fill="#C68642"/>
  <ellipse cx="234" cy="387" rx="4" ry="3.5" fill="#C68642"/>
  <ellipse cx="240" cy="386" rx="4" ry="3" fill="#C68642"/>

  <!-- Pe direito: dedos apontam para tras (espelhado) -->
  <ellipse cx="269" cy="393" rx="18" ry="8" fill="#C68642"/>
  <ellipse cx="284" cy="390" rx="5" ry="4" fill="#C68642"/>
  <ellipse cx="278" cy="387" rx="4" ry="3.5" fill="#C68642"/>
  <ellipse cx="272" cy="386" rx="4" ry="3" fill="#C68642"/>

  <!-- Folhas extras decorativas ao redor -->
  <path d="M80 280 Q100 260 120 280 Q100 270 80 280Z" fill="#43A047" opacity="0.5"/>
  <path d="M70 310 Q95 295 110 315 Q90 305 70 310Z" fill="#2E7D32" opacity="0.4"/>
  <path d="M390 400 Q415 385 430 405 Q410 395 390 400Z" fill="#43A047" opacity="0.5"/>

  <!-- Heliconia / estrelicia (flor tipica amazonica) no canto esquerdo -->
  <g transform="translate(65, 200) rotate(-10)">
    <path d="M0 0 L5 -25 L15 -5Z" fill="#FF6D00" opacity="0.8"/>
    <path d="M5 -10 L10 -35 L20 -15Z" fill="#E65100" opacity="0.8"/>
    <path d="M10 -20 L15 -45 L25 -25Z" fill="#FF8F00" opacity="0.8"/>
    <line x1="10" y1="5" x2="12" y2="-40" stroke="#2E7D32" stroke-width="2"/>
  </g>
</svg>
